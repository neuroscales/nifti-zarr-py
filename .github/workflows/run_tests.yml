name: Run tests
on:
  workflow_dispatch:
    inputs:
      checkout:
        description: 'Commit / Branch / Tag / SHA to checkout'
        required: false
        default: ''
  workflow_call:
    inputs:
      checkout:
        description: 'Commit / Branch / Tag / SHA to checkout'
        required: false
        default: ''
        type: string
  push:
    paths:
      - tests/**
      - niizarr/**
      - setup.py
      - pyproject.toml
  pull_request:

jobs:
  run-unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: False
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        fsspec: ["with-fsspec", "no-fsspec"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout }}
          submodules: 'recursive'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -U "zarr>=3.4" "ome-zarr-models>=1.8"

      - name: Install nifti-zarr
        shell: bash
        run: |
          if [ "${{ matrix.fsspec }}" = "with-fsspec" ]; then
            python -m pip install ".[test,http,s3]"
          else
            python -m pip install ".[test]"
          fi

      - name: Run tests
        run: python -m pytest tests
