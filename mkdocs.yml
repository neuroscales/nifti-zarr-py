site_name: NIfTI-Zarr
site_description: >-
  NIfTI-Zarr: a cloud-friendly, multi-resolution format for neuroimaging
  data, and its reference Python implementation.
site_url: https://nifti-zarr.lincbrain.org/
repo_url: https://github.com/neuroscales/nifti-zarr-py
repo_name: neuroscales/nifti-zarr-py

nav:
  - Home: index.md
  - Specification: specification.md
  - JSON schema: schema.md
  - API reference: api.md
  - Building the docs: building-the-docs.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            heading_level: 2
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  # Honour ordered-list start numbers (the specification's table of
  # contents starts at 0).
  - sane_lists
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.quotes:
      # Render GitHub alerts (> [!NOTE]) used in the specification README.
      callouts: true
  - pymdownx.snippets:
      base_path: [.]
      # Fail the build if an included file is missing, e.g. when the
      # nifti-zarr-schema submodule has not been checked out.
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tilde
